<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Павильон Свитков: Твоя Медиатека Дорам</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #24141d 0%, #0f0a0d 100%);
            color: #f1e4cb;
            font-family: 'Georgia', serif;
            min-height: 100vh;
        }
        #wrapper { max-width: 1000px; margin: 0 auto; padding: 20px; box-sizing: border-box; }
        
        header {
            text-align: center; padding: 25px 10px; border: 2px solid #b38f43; background: rgba(0, 0, 0, 0.4);
            border-radius: 4px; box-shadow: inset 0 0 20px rgba(179, 143, 67, 0.2), 0 0 15px rgba(0,0,0,0.5); margin-bottom: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        header h1 { margin: 0; font-size: 36px; letter-spacing: 4px; color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); font-weight: normal; }
        header p { margin: 0; font-size: 14px; color: #ff4757; text-transform: uppercase; letter-spacing: 2px; }
        
        #add-trigger-btn {
            background: linear-gradient(135deg, #d4af37 0%, #aa8416 100%); border: 1px solid #b38f43; color: #0f0a0d;
            padding: 10px 20px; font-size: 15px; font-family: 'Georgia', serif; font-weight: bold; cursor: pointer;
            border-radius: 4px; box-shadow: 0 4px 10px rgba(212,175,55,0.2); transition: all 0.2s; margin-top: 5px;
        }
        #add-trigger-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px #d4af37; }

        #search-container { width: 100%; margin-bottom: 25px; display: flex; justify-content: center; }
        #search-input {
            width: 100%; max-width: 600px; background: rgba(18, 10, 14, 0.8); border: 2px solid #b38f43; color: #f1e4cb;
            padding: 12px 20px; font-size: 16px; font-family: 'Georgia', serif; border-radius: 30px; box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(179, 143, 67, 0.2); transition: all 0.3s; text-align: center;
        }
        #search-input:focus { outline: none; border-color: #ff4757; box-shadow: 0 0 15px rgba(255, 71, 87, 0.4); }
        #search-input::placeholder { color: rgba(241, 228, 203, 0.4); font-style: italic; }

        .menu-title { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; width: 100%; text-align: center; margin-bottom: 5px; margin-top: 5px; }
        #genre-menu, #country-menu, #status-menu { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; width: 100%; }
        #status-menu { margin-bottom: 30px; border-bottom: 1px dashed rgba(179, 143, 67, 0.3); padding-bottom: 20px; }
        
        .filter-btn {
            background: linear-gradient(135deg, #3d1422 0%, #1a080f 100%); border: 1px solid #b38f43; color: #f1e4cb;
            padding: 8px 16px; font-size: 13px; font-family: 'Georgia', serif; cursor: pointer; border-radius: 2px; transition: all 0.2s ease;
        }
        .filter-btn:hover, .filter-btn.active { border-color: #ff4757; color: #fff; background: #ff4757; box-shadow: 0 0 12px rgba(255, 71, 87, 0.4); transform: translateY(-2px); }
        .country-btn-style { border-color: #eccc68; }
        .filter-btn.country-btn-style:hover, .filter-btn.country-btn-style.active { border-color: #eccc68; background: #eccc68; color: #0f0a0d; box-shadow: 0 0 12px rgba(236, 204, 104, 0.4); }
        .status-btn-style { border-color: #00f2fe; }
        .filter-btn.status-btn-style:hover, .filter-btn.status-btn-style.active { border-color: #00f2fe; background: #00f2fe; color: #0f0a0d; box-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }

        #dorama-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; width: 100%; }
        .dorama-card { position: relative; background: rgba(25, 15, 20, 0.85); border: 1px solid #b38f43; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.3s ease, border-color 0.3s ease; }
        .dorama-card:hover { transform: translateY(-5px); border-color: #ff4757; }
        
        .delete-card-btn {
            position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); border: 1px solid #ff4757; color: #ff4757;
            border-radius: 50%; width: 26px; height: 26px; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 10; transition: all 0.2s;
        }
        .delete-card-btn:hover { background: #ff4757; color: white; transform: scale(1.1); }

        .poster-wrapper { width: 100%; height: 200px; overflow: hidden; position: relative; border-bottom: 1px solid rgba(179, 143, 67, 0.3); background: linear-gradient(45deg, #2d1822, #4d1c2b); }
        .poster-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .dorama-card:hover .poster-img { transform: scale(1.05); }
        .poster-placeholder { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 50px; color: rgba(214, 175, 55, 0.15); }
        
        .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { margin: 0; font-size: 20px; color: #d4af37; font-weight: normal; }
        .card-tags { margin: 8px 0; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        .tag { font-size: 11px; background: rgba(255, 71, 87, 0.15); color: #ff4757; padding: 2px 8px; border-radius: 2px; border: 1px solid rgba(255, 71, 87, 0.3); }
        .country-badge { font-size: 11px; background: rgba(236, 204, 104, 0.1); color: #eccc68; padding: 2px 8px; border-radius: 2px; border: 1px solid rgba(236, 204, 104, 0.3); }
        .status-badge { font-size: 11px; background: rgba(0, 242, 254, 0.1); color: #00f2fe; padding: 2px 8px; border-radius: 2px; border: 1px solid rgba(0, 242, 254, 0.3); font-weight: bold; }
        .open-scroll-btn { margin-top: auto; background: transparent; border: 1px solid #b38f43; color: #b38f43; padding: 8px; cursor: pointer; font-family: 'Georgia', serif; font-weight: bold; transition: all 0.2s; }
        .open-scroll-btn:hover { background: #b38f43; color: #0f0a0d; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); z-index: 1000; }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1f1218; border: 2px solid #d4af37; padding: 25px; width: 90%; max-width: 450px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); border-radius: 4px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #b38f43; }
        .close-modal:hover { color: #ff4757; }
        
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { color: #d4af37; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { background: #120a0e; border: 1px solid #b38f43; color: #f1e4cb; padding: 8px; font-family: 'Georgia', serif; border-radius: 4px; box-sizing: border-box; width: 100%; }
        .form-group textarea { height: 60px; resize: none; }
        .checkbox-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 3px; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 14px; color: #f1e4cb; }
        .submit-btn { background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-family: 'Georgia', serif; cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3); }
        
        .modal-title { color: #d4af37; font-size: 24px; margin-top: 0; font-weight: normal; border-bottom: 1px dashed #b38f43; padding-bottom: 10px;}
        .modal-meta-line { font-size: 13px; color: #eccc68; margin-top: 5px; font-weight: bold; display: flex; gap: 15px; }
        .modal-rating { color: #ffeb3b; font-size: 16px; margin: 10px 0; }
        .modal-desc { font-size: 14px; line-height: 1.6; color: #ddd; margin-bottom: 15px; }
        
        .links-area { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .link-btn-custom { display: block; text-align: center; color: white; text-decoration: none; padding: 10px; border-radius: 4px; font-weight: bold; transition: transform 0.2s; font-size: 14px; }
        .link-btn-custom:hover { transform: translateY(-2px); }
        .btn-tg { background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); box-shadow: 0 4px 10px rgba(255, 71, 87, 0.2); }
        .btn-extra1 { background: linear-gradient(135deg, #a55eea 0%, #8854d0 100%); box-shadow: 0 4px 10px rgba(165, 94, 234, 0.2); }
        .btn-extra2 { background: linear-gradient(135deg, #00f2fe 0%, #00a8ff 100%); color: #0f0a0d; box-shadow: 0 4px 10px rgba(0, 242, 254, 0.2); }

        footer { margin-top: 50px; text-align: center; padding: 20px; border-top: 1px dashed rgba(179,143,67,0.3); display: flex; justify-content: center; gap: 15px; }
        .sync-btn { background: none; border: 1px dashed #b38f43; color: rgba(241, 228, 203, 0.6); padding: 6px 14px; font-family: 'Georgia', serif; font-size: 12px; cursor: pointer; transition: all 0.2s; border-radius: 4px; }
        .sync-btn:hover { border-color: #ff4757; color: #fff; background: rgba(255,71,87,0.1); }
    </style>
</head>
<body>

    <div id="wrapper">
        <header>
            <h1>ПАВИЛЬОН СВИТКОВ</h1>
            <p>Императорская Хранимая Медиатека</p>
            <button id="add-trigger-btn" onclick="openAddModal()">🏮 Добавить свиток дорамы</button>
        </header>

        <div id="search-container">
            <input type="text" id="search-input" oninput="onSearchInputHandle(this.value)" placeholder="Поиск свитка по названию...">
        </div>

        <div class="menu-title">Фильтр по жанрам</div>
        <div id="genre-menu">
            <button class="filter-btn active" onclick="filterGenre('all', this)">Все Жанры</button>
            <button class="filter-btn" onclick="filterGenre('BL', this)">BL</button>
            <button class="filter-btn" onclick="filterGenre('Гет', this)">Гет</button>
            <button class="filter-btn" onclick="filterGenre('Историческое', this)">Историческое</button>
            <button class="filter-btn" onclick="filterGenre('Современное', this)">Современное</button>
            <button class="filter-btn" onclick="filterGenre('Омегаверс', this)">Омегаверс</button>
        </div>

        <div class="menu-title">Фильтр по странaм</div>
        <div id="country-menu">
            <button class="filter-btn country-btn-style active" onclick="filterCountry('all', this)">Все Страны</button>
            <button class="filter-btn country-btn-style" onclick="filterCountry('Китай', this)">🇨🇳 Китай</button>
            <button class="filter-btn country-btn-style" onclick="filterCountry('Корея', this)">🇰🇷 Корея</button>
            <button class="filter-btn country-btn-style" onclick="filterCountry('Таиланд', this)">🇹🇭 Таиланд</button>
            <button class="filter-btn country-btn-style" onclick="filterCountry('Япония', this)">🇯🇵 Япония</button>
            <button class="filter-btn country-btn-style" onclick="filterCountry('Другие', this)">🌍 Другие</button>
        </div>

        <div class="menu-title">Фильтр по спискам просмотра</div>
        <div id="status-menu">
            <button class="filter-btn status-btn-style active" onclick="filterStatus('all', this)">Все Свитки</button>
            <button class="filter-btn status-btn-style" onclick="filterStatus('Ожидаю выхода', this)">🎬 Ожидаю выхода</button>
            <button class="filter-btn status-btn-style" onclick="filterStatus('В планах', this)">📌 В планах</button>
            <button class="filter-btn status-btn-style" onclick="filterStatus('Просмотрено', this)">✅ Просмотрено</button>
        </div>

        <div id="dorama-grid"></div>
        
        <footer>
            <button class="sync-btn" onclick="exportDatabase()">💾 Скопировать архив базы (для телефона)</button>
            <button class="sync-btn" onclick="importDatabase()">📂 Вставить архив базы на устройство</button>
        </footer>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЕЙ -->
    <div id="dorama-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('dorama-modal')">&times;</span>
            <h2 id="modal-name" class="modal-title">Название</h2>
            <div class="modal-meta-line">
                <span id="modal-country">🇨🇳 Китай</span>
                <span id="modal-status" style="color: #00f2fe;">Статус</span>
            </div>
            <div id="modal-rate" class="modal-rating"></div>
            <p id="modal-description" class="modal-desc"></p>
            
            <div class="links-area">
                <a id="modal-link-tg" href="#" target="_blank" class="link-btn-custom btn-tg">Смотреть в Telegram ➔</a>
                <a id="modal-link-ex1" href="#" target="_blank" class="link-btn-custom btn-extra1">Открыть доп. свиток 1 ➔</a>
                <a id="modal-link-ex2" href="#" target="_blank" class="link-btn-custom btn-extra2">Открыть доп. свиток 2 ➔</a>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('add-modal')">&times;</span>
            <h2 class="modal-title" style="font-size: 20px;">🏮 Новый Свиток Дорамы</h2>
            
            <div class="form-group">
                <label>Название дорамы:</label>
                <input type="text" id="form-title" placeholder="Например: Неукротимый">
            </div>

            <div class="form-group">
                <label>Ссылка на картинку обложки / постера:</label>
                <input type="text" id="form-image" placeholder="Вставь URL картинки (необязательно)">
            </div>
            
            <div class="form-group">
                <label>Выберите Жанры:</label>
                <div class="checkbox-group">
                    <div class="checkbox-item"><input type="checkbox" name="form-genres" value="BL"> BL</div>
                    <div class="checkbox-item"><input type="checkbox" name="form-genres" value="Гет"> Гет</div>
                    <div class="checkbox-item"><input type="checkbox" name="form-genres" value="Историческое"> Историческое</div>
                    <div class="checkbox-item"><input type="checkbox" name="form-genres" value="Современное"> Современное</div>
                    <div class="checkbox-item"><input type="checkbox" name="form-genres" value="Омегаверс"> Омегаверс</div>
                </div>
            </div>

            <div class="form-group">
                <label>Страна производства:</label>
                <select id="form-country">
                    <option value="Китай">🇨🇳 Китай</option>
                    <option value="Корея">🇰🇷 Корея</option>
                    <option value="Таиланд">🇹🇭 Таиланд</option>
                    <option value="Япония">🇯🇵 Япония</option>
                    <option value="Другие">🌍 Другие</option>
                </select>
            </div>

            <div class="form-group">
                <label>Текущий статус просмотра:</label>
                <select id="form-status" onchange="onStatusChangeHandle(this.value)">
                    <option value="Просмотрено">✅ Просмотрено</option>
                    <option value="В планах" selected>📌 В планах</option>
                    <option value="Ожидаю выхода">🎬 Ожидаю выхода</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Твоя оценка (фонарики):</label>
                <select id="form-rating">
                    <option value="none" selected>Пока без оценки (Для планов/ожидания)</option>
                    <option value="5">🏮 🏮 🏮 🏮 🏮 (Шедевр!)</option>
                    <option value="4">🏮 🏮 🏮 🏮 (Отлично)</option>
                    <option value="3">🏮 🏮 🏮 (Нормально)</option>
                    <option value="2">🏮 🏮 (На один раз)</option>
                    <option value="1">🏮 (Не понравилось)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Твои мысли / Аннотация:</label>
                <textarea id="form-desc" placeholder="Почему стоит посмотреть этот тайтл..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Ссылка на Telegram канал/пост:</label>
                <input type="text" id="form-link-tg" placeholder="https://t.me/...">
            </div>

            <div class="form-group">
                <label>Дополнительная ссылка 1:</label>
                <input type="text" id="form-link-ex1" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>Дополнительная ссылка 2:</label>
                <input type="text" id="form-link-ex2" placeholder="https://...">
            </div>
            
            <button class="submit-btn" onclick="saveNewDorama()">Сохранить свиток в Павильон ✨</button>
        </div>
    </div>

<script>
    let defaultDoramas = [
        { id: 1, title: "Неукротимый: Повелитель Чэньцин", genres: ["BL", "Историческое"], country: "Китай", status: "Просмотрено", rating: "🏮 🏮 🏮 🏮 🏮", description: "Культовая история о преданности, родственных душах и заклинателях.", linkTg: "https://t.me/", linkEx1: "", linkEx2: "", image: "https://images.vfl.ru/ii/1564757304/0cb54911/27414902.jpg" }
    ];

    let doramas = JSON.parse(localStorage.getItem('pavilion_doramas_db'));
    if (!doramas || doramas.length === 0) {
        doramas = defaultDoramas;
        localStorage.setItem('pavilion_doramas_db', JSON.stringify(doramas));
    }

    let currentGenreFilter = 'all';
    let currentCountryFilter = 'all';
    let currentStatusFilter = 'all';
    let searchQuery = '';

    const flagMap = { 'Китай': '🇨🇳', 'Корея': '🇰🇷', 'Таиланд': '🇹🇭', 'Япония': '🇯🇵', 'Другие': '🌍' };

    function renderDoramas() {
        const grid = document.getElementById('dorama-grid');
        grid.innerHTML = '';
        
        let filteredList = doramas;
        if (currentGenreFilter !== 'all') { filteredList = filteredList.filter(d => d.genres.includes(currentGenreFilter)); }
        if (currentCountryFilter !== 'all') { filteredList = filteredList.filter(d => d.country === currentCountryFilter); }
        if (currentStatusFilter !== 'all') { filteredList = filteredList.filter(d => d.status === currentStatusFilter); }
        if (searchQuery.trim() !== '') { filteredList = filteredList.filter(d => d.title.toLowerCase().includes(searchQuery.toLowerCase())); }

        filteredList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'dorama-card';
            const tagsHTML = item.genres.map(g => `<span class="tag">${g}</span>`).join('');
            let statusIcon = item.status === 'Просмотрено' ? '✅' : item.status === 'В планах' ? '📌' : '🎬';
            let flag = flagMap[item.country] || '🌍';

            let posterHTML = `<div class="poster-placeholder">🏮</div>`;
            if (item.image && item.image.trim() !== "") {
                posterHTML = `<img src="${item.image}" class="poster-img" onerror="this.style.display='none';">`;
            }

            card.innerHTML = `
                <button class="delete-card-btn" onclick="deleteDorama(${item.id}, event)">×</button>
                <div class="poster-wrapper">${posterHTML}</div>
                <div class="card-body">
                    <h3 class="card-title">${item.title}</h3>
                    <div class="card-tags">
                        <span class="status-badge">${statusIcon} ${item.status}</span>
                        <span class="country-badge">${flag} ${item.country}</span>
                        ${tagsHTML}
                    </div>
                    <button class="open-scroll-btn" onclick="openDetailsModal(${item.id})">Свиток деталей</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function deleteDorama(id, event) {
        event.stopPropagation();
        if (confirm("Удалить этот свиток из Павильона навсегда?")) {
            doramas = doramas.filter(d => d.id !== id);
            localStorage.setItem('pavilion_doramas_db', JSON.stringify(doramas));
            renderDoramas();
        }
    }

    function onSearchInputHandle(val) { searchQuery = val; renderDoramas(); }
    function onStatusChangeHandle(statusValue) {
        const ratingSelect = document.getElementById('form-rating');
        if (statusValue === 'В планах' || statusValue === 'Ожидаю выхода') { ratingSelect.value = 'none'; } 
        else if (statusValue === 'Просмотрено' && ratingSelect.value === 'none') { ratingSelect.value = '5'; }
    }

    function filterGenre(genre, btnElement) { document.querySelectorAll('#genre-menu .filter-btn').forEach(b => b.classList.remove('active')); btnElement.classList.add('active'); currentGenreFilter = genre; renderDoramas(); }
    function filterCountry(country, btnElement) { document.querySelectorAll('#country-menu .filter-btn').forEach(b => b.classList.remove('active')); btnElement.classList.add('active'); currentCountryFilter = country; renderDoramas(); }
    function filterStatus(status, btnElement) { document.querySelectorAll('#status-menu .filter-btn').forEach(b => b.classList.remove('active')); btnElement.classList.add('active'); currentStatusFilter = status; renderDoramas(); }
    function openAddModal() { document.getElementById('add-modal').style.display = 'block'; onStatusChangeHandle(document.getElementById('form-status').value); }
    
    function openDetailsModal(id) {
        const dorama = doramas.find(d => d.id === id);
        if (!dorama) return;
        let statusIcon = dorama.status === 'Просмотрено' ? '✅' : dorama.status === 'В планах' ? '📌' : '🎬';
        let flag = flagMap[dorama.country] || '🌍';

        document.getElementById('modal-name').innerText = dorama.title;
        document.getElementById('modal-country').innerText = `${flag} Страна: ${dorama.country}`;
        document.getElementById('modal-status').innerText = `${statusIcon} Status: ${dorama.status}`;
        
        const rateBox = document.getElementById('modal-rate');
        if (dorama.rating === 'none' || !dorama.rating) { rateBox.style.display = 'none'; } 
        else { rateBox.style.display = 'block'; rateBox.innerText = dorama.rating; }
        
        document.getElementById('modal-description').innerText = dorama.description;
        setupLinkButton('modal-link-tg', dorama.linkItemTg || dorama.linkTg);
        setupLinkButton('modal-link-ex1', dorama.linkEx1, "Открыть доп. свиток 1 ➔");
        setupLinkButton('modal-link-ex2', dorama.linkEx2, "Открыть доп. свиток 2 ➔");
        document.getElementById('dorama-modal').style.display = 'block';
    }

    function setupLinkButton(elementId, urlValue, defaultText) {
        const btn = document.getElementById(elementId);
        if (!urlValue || urlValue === "#" || urlValue.trim() === "") { btn.style.display = 'none'; } 
        else { btn.style.display = 'block'; btn.href = urlValue; if (defaultText) btn.innerText = defaultText; }
    }
    
    function closeModal(modalId) { document.getElementById(modalId).style.display = 'none'; }

    function saveNewDorama() {
        const title = document.getElementById('form-title').value.trim();
        const image = document.getElementById('form-image').value.trim();
        const desc = document.getElementById('form-desc').value.trim();
        const linkTg = document.getElementById('form-link-tg').value.trim();
        const linkEx1 = document.getElementById('form-link-ex1').value.trim();
        const linkEx2 = document.getElementById('form-link-ex2').value.trim();
        const country = document.getElementById('form-country').value;
        const status = document.getElementById('form-status').value;
        const rateVal = document.getElementById('form-rating').value;
        const checkboxes = document.querySelectorAll('input[name="form-genres"]:checked');
        const selectedGenres = Array.from(checkboxes).map(cb => cb.value);
        
        if (!title) { alert("Пожалуйста, введи название дорамы!"); return; }
        if (selectedGenres.length === 0) { alert("Выбери хотя бы один жанр!"); return; }
        
        let ratingLanterns = "none";
        if (rateVal !== 'none') {
            ratingLanterns = "";
            const count = parseInt(rateVal);
            for(let i=0; i<count; i++) ratingLanterns += "🏮 ";
        }

        const newDorama = {
            id: Date.now(), title: title, image: image, genres: selectedGenres, country: country, status: status, rating: ratingLanterns,
            description: desc || "Личные свитки воспоминаний пока пусты...", linkItemTg: linkTg, linkEx1: linkEx1, linkEx2: linkEx2
        };

        doramas.push(newDorama);
        localStorage.setItem('pavilion_doramas_db', JSON.stringify(doramas));
        
        document.getElementById('form-title').value = ''; document.getElementById('form-image').value = ''; document.getElementById('form-desc').value = '';
        document.getElementById('form-link-tg').value = ''; document.getElementById('form-link-ex1').value = ''; document.getElementById('form-link-ex2').value = '';
        document.querySelectorAll('input[name="form-genres"]').forEach(cb => cb.checked = false);
        document.getElementById('form-status').value = 'В планах';
        
        closeModal('add-modal');
        renderDoramas();
    }

    function exportDatabase() {
        const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(doramas))));
        navigator.clipboard.writeText(dataStr).then(() => {
            alert("Код архива скопирован в буфер обмена! Перешли его себе в Телеграм и вставь на другом устройстве.");
        }).catch(err => {
            alert("Не удалось скопировать автоматически. Вот твой код, скопируй его вручную:\n\n" + dataStr);
        });
    }

    function importDatabase() {
        const code = prompt("Вставь скопированный код архива сюда:");
        if (!code) return;
        try {
            const decodedData = JSON.parse(decodeURIComponent(escape(atob(code))));
            if (Array.isArray(decodedData)) {
                doramas = decodedData;
                localStorage.setItem('pavilion_doramas_db', JSON.stringify(doramas));
                renderDoramas();
                alert("Павильон Свитков успешно синхронизирован и обновлен!");
            } else { alert("Неверный формат архива."); }
        } catch(e) { alert("Ошибка при чтении архива. Убедись, что скопировала код полностью."); }
    }

    window.onclick = function(e) { if (e.target.classList.contains('modal')) { e.target.style.display = 'none'; } }
    renderDoramas();
</script>
</body>
</html>
